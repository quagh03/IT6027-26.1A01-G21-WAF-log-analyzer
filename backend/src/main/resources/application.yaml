spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/waf_analyzer
    username: waf
    password: ${POSTGRES_PASSWORD:waf}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: waf-security-backend
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: true
    listener:
      ack-mode: record
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: "1"
  ai:
    model:
      ollama:
        chat:
          enabled: false
        embedding:
          enabled: false

app:
  kafka:
    topics:
      raw-web-logs: raw-web-logs
      security-alerts: security-alerts
  scoring:
    # N in solution-design §7.4 — DetectionHit frequency window by client_ip
    window-minutes: 5
  incident:
    # W and K in solution-design §7.5
    window-minutes: 5
    aggregate-threshold: 3
  llm:
    # Host Ollama (qwen3.5:9b). Set APP_LLM_ENABLED=false to store SKIPPED and skip HTTP.
    enabled: ${APP_LLM_ENABLED:true}
    base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
    model: "${OLLAMA_MODEL:qwen3.5:9b}"
    timeout-seconds: 90
    max-alerts: 5
    # Empty uses classpath prompts/incident-explain.txt. Set a path to try other wording.
    prompt-file: ${LLM_PROMPT_FILE:}
  security:
    jwt:
      secret: ${JWT_SECRET:waf-lab-jwt-secret-change-me-32b!}
      access-token-minutes: 480
  cache:
    # Redis key TTLs (Pattern objects stay in-JVM only after fetch; source of truth is Redis)
    ttl:
      enabled-rules: 10m
      rule-pattern: 24h
      applications: 10m

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.huylq.it6027.backend.ingest: INFO
    com.huylq.it6027.backend.rules: INFO
    com.huylq.it6027.backend.alert: INFO
    com.huylq.it6027.backend.incident: INFO
    com.huylq.it6027.backend.llm: INFO
    org.springframework.kafka: INFO
