spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/waf_analyzer
    username: waf
    password: ${POSTGRES_PASSWORD:waf}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: waf-security-backend
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: true
    listener:
      ack-mode: record
  ai:
    model:
      ollama:
        chat:
          enabled: false
        embedding:
          enabled: false

app:
  kafka:
    topics:
      raw-web-logs: raw-web-logs

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.huylq.it6027.backend.ingest: INFO
    org.springframework.kafka: INFO
