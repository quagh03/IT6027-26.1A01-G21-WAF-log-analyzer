spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/waf_analyzer
    username: waf
    password: ${POSTGRES_PASSWORD:waf}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: waf-security-backend
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: true
    listener:
      ack-mode: record
  ai:
    model:
      ollama:
        chat:
          enabled: false
        embedding:
          enabled: false

app:
  kafka:
    topics:
      raw-web-logs: raw-web-logs
  scoring:
    # N in solution-design §7.4 — DetectionHit frequency window by client_ip
    window-minutes: 5
  cache:
    # Redis key TTLs (Pattern objects stay in-JVM only after fetch; source of truth is Redis)
    ttl:
      enabled-rules: 10m
      rule-pattern: 24h
      applications: 10m

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.huylq.it6027.backend.ingest: INFO
    com.huylq.it6027.backend.rules: INFO
    org.springframework.kafka: INFO
