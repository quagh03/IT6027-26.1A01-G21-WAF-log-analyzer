# Preserve client-requested path (incl. ../ and encodings). $uri is normalized and
# strips path-traversal sequences — useless for PATH_TRAVERSAL detection on access logs.
map $request_uri $waf_request_path {
    "~^(?P<path>[^?]*)" $path;
    default             $uri;
}

log_format waf_json escape=json
    '{'
        '"time_iso":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"host":"$host",'
        '"request_method":"$request_method",'
        '"uri":"$waf_request_path",'
        '"args":"$args",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"http_user_agent":"$http_user_agent",'
        '"http_referer":"$http_referer",'
        '"request_time":$request_time'
    '}';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream juice_shop {
    server juice-shop:3000;
}

# Image nginx alpine symlink access.log -> /dev/stdout; ghi file thật để Filebeat tail được.
access_log /var/log/nginx/waf-access.log waf_json buffer=8k flush=1s;

server {
    listen 80 default_server;
    server_name juice.lab.local localhost 127.0.0.1;

    location / {
        proxy_pass http://juice_shop;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name shop.lab.local;

    location / {
        proxy_pass http://juice_shop;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
